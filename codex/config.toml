approval_policy = "never"
#since codex 0.116 the old workspace-write sandbox mode uses another cli tool to do sandboxing
# called bubblerwap (bwrap). We are changing it to danger-full-access because it's in a container
sandbox_mode = "danger-full-access"
model_reasoning_effort = "low"
model = "gpt-5.5"

[tui.model_availability_nux]
"gpt-5.5" = 2

[projects."/codex-context"]
trust_level = "trusted"

[notice]
fast_default_opt_out = true
